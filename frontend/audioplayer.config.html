<div layout="column" layout-padding ng-cloak>

    <config-section cl-title="Fades"></config-section>
    <config-number
        cl-title="Fade in (ms)" cl-model="$ctrl.fadeInMs" cl-min="0"
        cl-click="$ctrl.saveFade()"
    ></config-number>
    <config-number
        cl-title="Fade out (ms)" cl-model="$ctrl.fadeOutMs" cl-min="0"
        cl-click="$ctrl.saveFade()"
    ></config-number>
    <config-number
        cl-title="Playlist crossfade (ms)" cl-model="$ctrl.crossfadeMs" cl-min="0"
        cl-click="$ctrl.saveFade()"
    ></config-number>
    <config-note
        cl-type="info" cl-icon="information"
        cl-note="Crossfade overlaps the end of the current track with the start of the next one. Set to 0 to disable (hard cut)."
    ></config-note>

    <config-section cl-title="Create player"></config-section>
    <config-text
        cl-title="Stream url" cl-model="$ctrl.url"
    ></config-text>
    <config-select
        cl-title="Stream format" cl-model="$ctrl.selectedFormat"
        cl-options="$ctrl.formats"
    ></config-select>
    <config-button
        cl-icon="" cl-btn-icon="play" cl-btn-label="Start playback"
        cl-click="$ctrl.play()"
    ></config-button>

    <config-section cl-title="Players list"></config-section>
    <config-list
        cl-empty="No player running" cl-items="$ctrl.players"
    ></config-list>

</div>
